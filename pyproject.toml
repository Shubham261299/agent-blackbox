[project]
name = "agent-blackbox"
version = "0.1.0"
description = "Local-first observability and evaluation workbench for AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "ollama==0.6.3",
    "httpx==0.28.1",  # imported directly (agent/errors.py); ollama also needs it
]

# What running the app needs is above. Tests and the GIF script are `dev`; the judge model tooling (planned, not used by any
# published number) is `judge`. Nothing at run time imports either.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pillow==13.0.0",  # draws the captioned GIF (scripts/make_demo_gif.py)
]
judge = ["deepeval==4.2.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Source lives in backend/. Installing the project (editable) puts `blackbox` on the path, so
# `python -m blackbox.evals` and `uvicorn --factory blackbox.api.main:create_app` work from any folder.
[tool.setuptools.packages.find]
where = ["backend"]
include = ["blackbox*"]

[tool.setuptools.package-data]
"blackbox.evals" = ["datasets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
# DeepEval (the optional `judge` extra) auto-loads a pytest plugin that can emit anonymous telemetry; we call its metrics directly instead.
addopts = "-p no:deepeval"
markers = [
    "integration: needs local Jaeger on :16686/:4318 (docker compose up -d jaeger)",
]
