server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls /api/...; the API does not know that prefix, so it is removed on the way through.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Hash routing needs no rewrite rules: every page is index.html.
    location / {
        try_files $uri /index.html;
    }
}
